<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Edson Eletricista</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23141414'/><path d='M13 4 6 13h4l-1 7 8-11h-5z' fill='%23ffcc00'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--ink:#141414;--muted:#6b7280;--line:#e7e9ee;--bg:#f4f5f7;--card:#fff;--brand:#ffcc00;--wa:#25d366;--blue:#2563eb;--radius:14px;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  .top{background:var(--ink);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .top h1{margin:0;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:9px;}
  .top h1 .b{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#141414;font-weight:900;}
  .top .meta{font-size:.82rem;color:#b9bdc6;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .filters{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:100px;padding:4px;gap:4px;}
  .filters button{border:none;background:none;font:inherit;font-weight:600;font-size:.9rem;color:var(--muted);padding:8px 16px;border-radius:100px;cursor:pointer;transition:.15s;}
  .filters button.active{background:var(--ink);color:#fff;}
  .refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink);}
  .refresh:hover{border-color:var(--ink);}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
  .card .k{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:7px;}
  .card .k i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .card .v{font-size:2.3rem;font-weight:800;line-height:1.1;margin-top:6px;}
  .card .s{font-size:.82rem;color:var(--muted);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:1rem;font-weight:700;}
  .chartbox{position:relative;height:300px;}
  #tablebox{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:460px;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);}
  th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  .pg{font-weight:600;}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:100px;background:#eef2ff;color:var(--blue);margin-left:6px;}
  .rate{font-weight:700;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  @media(max-width:720px){.cards{grid-template-columns:1fr;}.chartbox{height:260px;}}
</style>
</head>
<body>
  <header class="top">
    <h1><span class="b">⚡</span> Painel · Edson Eletricista</h1>
    <span class="meta" id="updated">—</span>
  </header>

  <div class="wrap">
    <div class="bar">
      <div class="filters" id="filters">
        <button data-days="3">3 dias</button>
        <button data-days="7" class="active">7 dias</button>
        <button data-days="14">14 dias</button>
      </div>
      <button class="refresh" id="refresh">↻ Atualizar</button>
    </div>

    <div class="cards">
      <div class="card"><div class="k"><i style="background:var(--blue)"></i>Visitas</div><div class="v" id="c-views">0</div><div class="s">páginas abertas no período</div></div>
      <div class="card"><div class="k"><i style="background:var(--wa)"></i>Cliques no contato</div><div class="v" id="c-contacts">0</div><div class="s">cliques em WhatsApp / telefone</div></div>
      <div class="card"><div class="k"><i style="background:var(--brand)"></i>Taxa de contato</div><div class="v" id="c-rate">0%</div><div class="s">cliques ÷ visitas</div></div>
    </div>

    <div class="panel">
      <h2>Visitas e cliques por dia</h2>
      <div class="chartbox"><canvas id="chart"></canvas></div>
    </div>

    <div class="panel">
      <h2>Por página</h2>
      <div id="tablebox">
        <table>
          <thead><tr><th>Página</th><th class="num">Visitas</th><th class="num">Cliques</th><th class="num">WhatsApp</th><th class="num">Telefone</th><th class="num">Taxa</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">Ainda sem dados nesse período.</div>
      </div>
    </div>
  </div>

<script>
(function () {
  var base = location.pathname.replace(/\/$/, '');
  var days = 7, chart = null;

  function fmt(n){ return (n||0).toLocaleString('pt-BR'); }
  function pageLabel(p){
    if (p === '/' || p === '/index') return 'Home';
    if (p === '/v2') return 'Variante /v2';
    return p;
  }

  function draw(d) {
    document.getElementById('c-views').textContent = fmt(d.totals.views);
    document.getElementById('c-contacts').textContent = fmt(d.totals.contacts);
    document.getElementById('c-rate').textContent = (d.totals.rate || 0) + '%';
    document.getElementById('updated').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' · retenção ' + d.retention + ' dias';

    var labels = d.daily.map(function (x){ var p=x.day.split('-'); return p[2]+'/'+p[1]; });
    var views = d.daily.map(function (x){ return x.views; });
    var contacts = d.daily.map(function (x){ return x.contacts; });
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels: labels, datasets: [
        { label:'Visitas', data:views, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.08)', fill:true, tension:.3, borderWidth:2.5, pointRadius:3 },
        { label:'Cliques', data:contacts, borderColor:'#25d366', backgroundColor:'rgba(37,211,102,.08)', fill:true, tension:.3, borderWidth:2.5, pointRadius:3 }
      ]},
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ usePointStyle:true, boxWidth:8, font:{family:'Inter'} } } },
        scales:{ y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{ color:'#eef0f3' } }, x:{ grid:{ display:false } } } }
    });

    var tb = document.getElementById('tbody'); tb.innerHTML = '';
    document.getElementById('empty').style.display = d.pages.length ? 'none' : 'block';
    d.pages.forEach(function (p) {
      var tr = document.createElement('tr');
      var tag = p.page === '/v2' ? '<span class="tag">teste</span>' : '';
      tr.innerHTML = '<td class="pg">' + pageLabel(p.page) + tag + '</td>' +
        '<td class="num">' + fmt(p.views) + '</td>' +
        '<td class="num">' + fmt(p.contacts) + '</td>' +
        '<td class="num">' + fmt(p.whatsapp) + '</td>' +
        '<td class="num">' + fmt(p.phone) + '</td>' +
        '<td class="num rate">' + (p.rate || 0) + '%</td>';
      tb.appendChild(tr);
    });
  }

  function load() {
    fetch(base + '/data?days=' + days, { cache:'no-store' })
      .then(function (r){ return r.json(); })
      .then(draw)
      .catch(function(){ document.getElementById('updated').textContent = 'Erro ao carregar dados'; });
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    days = +b.getAttribute('data-days');
    [].forEach.call(this.children, function (x){ x.classList.toggle('active', x === b); });
    load();
  });
  document.getElementById('refresh').addEventListener('click', load);
  load();
  setInterval(load, 60000); // atualiza a cada 1 min
})();
</script>
</body>
</html>
